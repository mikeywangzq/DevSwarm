# DevSwarm Multi-Agent System Configuration

system:
  name: "DevSwarm"
  version: "1.0.0"
  workspace_root: "./workspace"

llm:
  provider: "openai"  # openai, anthropic, local
  temperature: 0.7
  max_tokens: 2000
  models:
    openai: "gpt-4"
    anthropic: "claude-3-sonnet-20240229"

agents:
  pm_agent:
    name: "PM_Agent"
    role: "Project Manager"
    enabled: true

  backend_agent:
    name: "Backend_Agent"
    role: "Backend Developer"
    enabled: true
    default_framework: "flask"

  frontend_agent:
    name: "Frontend_Agent"
    role: "Frontend Developer"
    enabled: true
    default_framework: "vanilla"  # vanilla, react, vue

  qa_agent:
    name: "QA_Agent"
    role: "Quality Assurance"
    enabled: true
    test_timeout: 30

message_bus:
  queue_size: 1000
  history_limit: 1000

web:
  host: "0.0.0.0"
  port: 3000
  debug: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "devswarm.log"
